name: Setup and bootstrap r-ci
description: Fetch run.sh script and bootstrap

inputs:
  dev_version:
    description: |
      Whether to use development version or release version of `run.sh`
    required: false
    default: 'FALSE'
  backend:
    description: |
      Whether to use 'BSPM' or 'RAPT' as backend (and use upper-case to select either).
      When left unset, the choice in run.sh applies which is either following an
      environment variable 'BACKEND' or its default value, currently 'BSPM'.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Setup
      id: r-ci
      run: |
        ## If a development version has been picked, use it.
        ## Note that this development version may at time just be the default. But
        ## if and when it differs, it can be picked here.
        if [[ ${{ inputs.dev_version }} == "TRUE" ]]; then
            curl -Ls https://eddelbuettel.github.io/r-ci/dev_run.sh -o run.sh
        else
            curl -OLs https://eddelbuettel.github.io/r-ci/run.sh
        fi
        chmod 0755 run.sh
        ## Only override when the input was actually given and is value, otherwise
        ## in run.sh the code `BACKEND=${BACKEND:-"BSPM"}` still sees an inherited
        ## environment variable if give. 
        if [[ -n "${{ inputs.backend }}" ]]; then
            if [[ ("${{ inputs.backend }}" == "BSPM") || ("${{ inputs.backend }}" == "RAPT") ]]; then
                export BACKEND=${{ inputs.backend }}
            else
                echo ":::warning:::BACKEND value '${inputs.backend}' ignored."
            fi
        fi
        ./run.sh bootstrap
      shell: bash
