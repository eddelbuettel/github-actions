name: Setup and bootstrap r-ci
description: Fetch run.sh script and bootstrap

inputs:
  dev_version:
    description: |
      Whether to use development version or release version of `run.sh`
    required: false
    default: 'FALSE'
  backend:
    description: |
      Whether to use 'BSPM' or 'RAPT' as backend (and use upper-case to select either).
      When left unset, run.sh's own default applies and an inherited BACKEND
      environment variable is honoured.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Setup
      id: r-ci
      run: |
        ## We currently do no need or provide a dev version so we just get run.sh
        if [[ ${{ inputs.dev_version }} == "TRUE" ]]; then
            curl -Ls https://eddelbuettel.github.io/r-ci/dev_run.sh -o run.sh
        else
            curl -OLs https://eddelbuettel.github.io/r-ci/run.sh
        fi
        chmod 0755 run.sh
        ## Only override when the input was actually given, so that run.sh's own
        ## `BACKEND=${BACKEND:-"BSPM"}` still sees an inherited environment
        ## variable. Exporting unconditionally made `env: BACKEND: RAPT` in a
        ## workflow silently ineffective.
        if [[ -n "${{ inputs.backend }}" ]]; then
            export BACKEND=${{ inputs.backend }}
        fi
        ./run.sh bootstrap
      shell: bash
