name: Setup and bootstrap r-ci
description: Fetch run.sh script and bootstrap

inputs:
  dev_version:
    description: |
      Whether to use development version or release version of `run.sh`
    required: false
    default: 'FALSE'
  backend:
    description: |
      Whether to use 'BSPM' or 'RAPT' as backend (and use upper-case to select either).
      This input is authoritative: a BACKEND environment variable set in the
      workflow does not reach run.sh, and is reported rather than ignored.
    required: false
    default: 'BSPM'

runs:
  using: "composite"
  steps:
    - name: Setup
      id: r-ci
      run: |
        ## We currently do no need or provide a dev version so we just get run.sh
        if [[ ${{ inputs.dev_version }} == "TRUE" ]]; then
            curl -Ls https://eddelbuettel.github.io/r-ci/dev_run.sh -o run.sh
        else
            curl -OLs https://eddelbuettel.github.io/r-ci/run.sh
        fi
        chmod 0755 run.sh
        ## The input stays authoritative, so run.sh remains free to drop its own
        ## default. What changes is that overriding an inherited BACKEND is no
        ## longer silent: `env: BACKEND: RAPT` in a workflow was overwritten here
        ## before run.sh ever looked, nothing errored, CI passed, and the only
        ## trace was one line of log reading "Selecting 'bspm'".
        if [[ -n "${BACKEND:-}" && "${BACKEND}" != "${{ inputs.backend }}" ]]; then
            echo "::warning::BACKEND=${BACKEND} from the environment is ignored by" \
                 "the r-ci action; pass it as an input instead:" \
                 "with: { backend: ${BACKEND} }"
        fi
        export BACKEND=${{ inputs.backend }}
        ./run.sh bootstrap
      shell: bash
